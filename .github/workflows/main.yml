name: Production Docker CI/CD (Proxmox)

on:
  push:
    branches: [ main ]

jobs:
  test-code:
    runs-on: self-hosted
    steps:
      - name: Скачиваем код из репозитория
        uses: actions/checkout@v4

      - name: Проверяем заголовок h1 и наличие Dockerfile
        run: |
          if grep -q "<h1>" index.html && [ -f Dockerfile ]; then
            echo "Ура! Тест пройден: верстка и Dockerfile на месте."
          else
            echo "ОШИБКА! Нет заголовка <h1> или отсутствует Dockerfile!"
            exit 1
          fi

  deploy-docker:
    needs: test-code
    runs-on: self-hosted
    steps:
      - name: Скачиваем проверенный код
        uses: actions/checkout@v4

      - name: Забираем данные из PostgreSQL Replica (порт 5433) и штампуем сборку
        run: |
          DB_ROWS=$(PGPASSWORD=secretpass psql -h ${{ secrets.DB_HOST }} -p 5433 -U postgres -t -A -F " — " -c "SELECT name, role FROM devops_team;" | sed 's/^/<li>/;s/$/<\/li>/' | tr -d '\n')
          echo "<div style='max-width:600px;margin:20px auto;padding:15px;background:#1e293b;border-radius:8px;color:#e2e8f0;font-family:sans-serif;'><h3>🗄️ Данные из СУБД PostgreSQL (Read-Only Replica :5433):</h3><ul>$DB_ROWS</ul></div>" >> index.html
          echo "<hr><p>Docker Container (nginx:alpine) | Сборка № ${{ github.run_number }} | Обновлено: $(date)</p>" >> index.html

      - name: Доставляем файлы и перезапускаем Docker-контейнер на prod-server
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} "mkdir -p /opt/app"
          scp -o StrictHostKeyChecking=accept-new index.html Dockerfile ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/app/
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} "cd /opt/app && docker build -t my-landing-image . && docker rm -f my-landing 2>/dev/null || true && docker run -d --name my-landing --restart always -p 80:80 my-landing-image"
