name: My First CI/CD Pipeline

# 1. ТРИГГЕР: Запускать робота при каждом изменении в ветке main
on:
  push:
    branches: [ main ]

# Выдаем роботу права на публикацию сайта
permissions:
  contents: read
  pages: write
  id-token: write

# 2. ЗАДАЧИ ДЛЯ РОБОТА (Jobs)
jobs:
  # --- ЭТАП 1: CI (Проверка кода) ---
  test-code:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код из репозитория
        uses: actions/checkout@v4

      - name: Проверяем, что на странице есть заголовок h1
        run: |
          if grep -q "<h1>" index.html; then
            echo "Ура! Тест пройден, заголовок найден."
          else
            echo "ОШИБКА! В файле index.html нет заголовка <h1>!"
            exit 1
          fi

  # --- ЭТАП 2: CD (Публикация сайта) ---
  deploy-site:
    needs: test-code # Запустится ТОЛЬКО если этап test-code прошел успешно!
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Скачиваем проверенный код
        uses: actions/checkout@v4

      - name: Упаковываем сайт для сервера
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Выкладываем сайт в интернет
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Добавляем штамп времени и номер сборки на сайт
        run: |
          echo "<hr><p>Сборка № ${{ github.run_number }} | Обновлено: $(date)</p>" >> index.html
